name: Rpython Unit Tests
# === Implementation notes ===
# Since the test suite is too large to run in a reasonable amount of time
# we split this into tests by sub-folder within the rpython folder

# Note: this action will only run if there are changes to one of:
#  - rpython folder
#  - .github folder
#  - pytest.py
# add more items to `paths` if we missed some!

on:
  push:
    branches: [ "main", "py3.[0-9]+" ]
    paths:
        - "rpython/**/*"
        - "pytest.py"
        - ".github/**/*"
  pull_request:
    branches: [ "main", "py3.[0-9]+" ]
    paths:
      - "rpython/**/*"
      - "pytest.py"
      - ".github/**/*"
  workflow_dispatch:

# Limit tests to latest commit on branches other than main
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.suite }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [misc, rlib, translator, jit-arch, jit-other]
        platform: [linux64, linux32, arm64, macos-x86_64, macos-arm64, win64]
        include:
          - platform: linux64
            runner: ubuntu-24.04
            # Container from the pypy/pypy-ci repo
            container: ghcr.io/pypy/buildworker_x86_64:latest
            arch: x86
          - platform: linux32
            runner: ubuntu-24.04
            # Container from the pypy/pypy-ci repo
            container: ghcr.io/pypy/buildworker_i686:latest
            arch: x86
          - platform: arm64
            runner: ubuntu-24.04-arm
            # Container from the pypy/pypy-ci repo
            container: ghcr.io/pypy/buildworker_aarch64:latest
            arch: arm64
          - platform: macos-x86_64
            runner: macos-15-intel
            arch: x86
            localbase: /usr/local
          - platform: macos-arm64
            runner: macos-latest
            arch: arm64
            localbase: /opt/homebrew
          - platform: win64
            runner: windows-latest
            arch: win64

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      if: ${{ !matrix.container }}
      with:
        python-version: "pypy2.7-7.3.22"
    - name: Install test dependencies
      if: ${{ !matrix.container }}
      run: pypy -m pip install hypothesis==4.39.3
    - name: Install macOS dependencies
      if: ${{ startsWith(matrix.runner, 'macos') }}
      run: |
        brew install bdw-gc binutils
        pypy -m pip install vmprof
    - name: Install Windows dependencies
      if: ${{ matrix.platform == 'win64' }}
      env:
        PYTHONPATH: .
      run: pypy get_externals.py
    - name: Create machine config
      shell: bash
      run: echo "parallel_runs=4" > machine_cfg.py
    - name: Run tests
      env:
        SUITE: ${{ matrix.suite }}
        ARCH: ${{ matrix.arch }}
        CONTAINER: ${{ matrix.container }}
        PYTHONPATH: .
        PYPY_LOCALBASE: ${{ matrix.localbase }}
      shell: bash
      run: |
        set -o pipefail
        case "$SUITE" in
          rlib)
            PYPYCHERRYPICK="rlib" ;;
          translator)
            PYPYCHERRYPICK="translator" ;;
          misc)
            case "$ARCH" in
              win64) PYPYCHERRYPICK="annotator:config:flowspace:tool:memory" ;;
              *)     PYPYCHERRYPICK="annotator:config:flowspace:tool:rtyper:memory" ;;
            esac ;;
          jit-arch)
            case "$ARCH" in
              arm64) PYPYCHERRYPICK="jit/backend/aarch64" ;;
              *)     PYPYCHERRYPICK="jit/backend/x86" ;;
            esac ;;
          jit-other)
            case "$ARCH" in
              arm64) PYPYCHERRYPICK="jit/metainterp:jit/codewriter:jit/tl:jit/tool:jit/backend/x86:jit/backend/arm:jit/backend/llgraph:jit/backend/llsupport:jit/backend/ppc:jit/backend/riscv:jit/backend/test:jit/backend/tool:jit/backend/zarch" ;;
              *)     PYPYCHERRYPICK="jit/metainterp:jit/codewriter:jit/tl:jit/tool:jit/backend/aarch64:jit/backend/arm:jit/backend/llgraph:jit/backend/llsupport:jit/backend/ppc:jit/backend/riscv:jit/backend/test:jit/backend/tool:jit/backend/zarch" ;;
            esac ;;
        esac
        export PYPYCHERRYPICK
        if [ -n "$CONTAINER" ]; then
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e PYPYCHERRYPICK \
            -e PYTHONPATH \
            "$CONTAINER" \
            pypy testrunner/runner.py \
              --config=pypy/testrunner_cfg.py \
              --config=machine_cfg.py \
              --root=rpython \
              --timeout=1759 \
              --logfile=testrun.log \
            2>&1 | tee testrun-output.log
        else
          pypy testrunner/runner.py \
            --config=pypy/testrunner_cfg.py \
            --config=machine_cfg.py \
            --root=rpython \
            --timeout=1759 \
            --logfile=testrun.log \
          2>&1 | tee testrun-output.log
        fi
    - name: Upload test logs
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.suite }}-testrun-log-${{ matrix.platform }}
        path: |
          testrun.log
          testrun-output.log
