name: Rpython Unit Tests
# === Implementation notes ===
# Since the test suite is too large to run in a reasonable amount of time
# we split this into tests by sub-folder within the rpython folder

# Note: this action will only run if there are changes to one of:
#  - rpython folder
#  - .github folder
#  - pytest.py
# add more items to `paths` if we missed some!

on:
  push:
    branches: [ "main", "py3.[0-9]+" ]
    paths:
        - "rpython/**/*"
        - "pytest.py"
        - ".github/**/*"
  pull_request:
    branches: [ "main", "py3.[0-9]+" ]
    paths:
      - "rpython/**/*"
      - "pytest.py"
      - ".github/**/*"
  workflow_dispatch:

# Limit tests to latest commit on branches other than main
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test-misc:
    name: test-misc (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux64
            runner: ubuntu-24.04
            container: ghcr.io/pypy/buildworker_x86_64:latest
            cherrypick: annotator:config:flowspace:tool:rtyper:memory
          - name: linux32
            runner: ubuntu-24.04
            docker_image: ghcr.io/pypy/buildworker_i686:latest
            cherrypick: annotator:config:flowspace:tool:rtyper:memory
          - name: arm64
            runner: ubuntu-24.04-arm
            container: ghcr.io/pypy/buildworker_aarch64:latest
            cherrypick: annotator:config:flowspace:tool:rtyper:memory
          - name: macos-x86_64
            runner: macos-13
            cherrypick: annotator:config:flowspace:tool:rtyper:memory
          - name: macos-arm64
            runner: macos-latest
            cherrypick: annotator:config:flowspace:tool:rtyper:memory
          - name: win64
            runner: windows-latest
            cherrypick: annotator:config:flowspace:tool:memory

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      if: ${{ !matrix.container && !matrix.docker_image }}
      with:
        python-version: "pypy2.7-7.3.22"
    - name: Install test dependencies
      if: ${{ !matrix.container && !matrix.docker_image }}
      run: pypy -m pip install hypothesis==4.39.3
    - name: Create machine config
      shell: bash
      run: echo "parallel_runs=4" > machine_cfg.py
    - name: Test Misc
      env:
        PYPYCHERRYPICK: ${{ matrix.cherrypick }}
        PYTHONPATH: .
        DOCKER_IMAGE: ${{ matrix.docker_image }}
      shell: bash
      run: |
        if [ -n "$DOCKER_IMAGE" ]; then
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e PYPYCHERRYPICK \
            -e PYTHONPATH \
            "$DOCKER_IMAGE" \
            pypy testrunner/runner.py \
              --config=pypy/testrunner_cfg.py \
              --config=machine_cfg.py \
              --root=rpython \
              --timeout=4000 \
              --logfile=testrun.log
        else
          pypy testrunner/runner.py \
            --config=pypy/testrunner_cfg.py \
            --config=machine_cfg.py \
            --root=rpython \
            --timeout=4000 \
            --logfile=testrun.log
        fi
    - name: Upload test log
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: misc-testrun-log-${{ matrix.name }}
        path: testrun.log

