name: Rpython Unit Tests
# === Implementation notes ===
# Since the test suite is too large to run in a reasonable amount of time
# we split this into tests by sub-folder within the rpython folder

# Note: this action will only run if there are changes to one of:
#  - rpython folder
#  - .github folder
#  - pytest.py
# add more items to `paths` if we missed some!

on:
  push:
    branches: [ "main", "py3.[0-9]+" ]
    paths:
        - "rpython/**/*"
        - "pytest.py"
        - ".github/**/*"
  pull_request:
    branches: [ "main", "py3.[0-9]+" ]
    paths:
      - "rpython/**/*"
      - "pytest.py"
      - ".github/**/*"
  workflow_dispatch:

# Limit tests to latest commit on branches other than main
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test-misc:
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            container: ghcr.io/pypy/buildworker_x86_64:latest
            cherrypick: annotator:config:flowspace:tool:rtyper
          - runner: windows-latest
            cherrypick: annotator:config:flowspace:tool

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      if: ${{ !matrix.container }}
      with:
        python-version: "pypy2.7-7.3.22"
    - name: Install test dependencies
      if: ${{ !matrix.container }}
      run: pypy -m pip install hypothesis==4.39.3
    - name: Create machine config
      shell: bash
      run: echo "parallel_runs=4" > machine_cfg.py
    - name: Test Misc
      env:
        PYPYCHERRYPICK: ${{ matrix.cherrypick }}
        PYTHONPATH: .
      shell: bash
      run: |
        pypy testrunner/runner.py \
          --config=pypy/testrunner_cfg.py \
          --config=machine_cfg.py \
          --root=rpython \
          --timeout=4000 \
          --logfile=testrun.log
    - name: Upload test log
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: misc-testrun-log-${{ matrix.runner }}
        path: testrun.log

  test-memory:
    runs-on: ubuntu-24.04
    container: ghcr.io/pypy/buildworker_x86_64:latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Create machine config
      shell: bash
      run: echo "parallel_runs=4" > machine_cfg.py
    - name: Test Memory
      env:
        PYPYCHERRYPICK: memory
        PYTHONPATH: .
      shell: bash
      run: |
        pypy testrunner/runner.py \
          --config=pypy/testrunner_cfg.py \
          --config=machine_cfg.py \
          --root=rpython \
          --timeout=4000 \
          --logfile=testrun.log
    - name: Upload test log
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: memory-testrun-log
        path: testrun.log

  test-rlib:
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            container: ghcr.io/pypy/buildworker_x86_64:latest
          - runner: windows-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      if: ${{ !matrix.container }}
      with:
        python-version: "pypy2.7-7.3.22"
    - name: Install test dependencies
      if: ${{ !matrix.container }}
      run: pypy -m pip install hypothesis==4.39.3
    - name: Create machine config
      shell: bash
      run: echo "parallel_runs=4" > machine_cfg.py
    - name: Test RLib
      env:
        PYPYCHERRYPICK: rlib
        PYTHONPATH: .
      shell: bash
      run: |
        pypy testrunner/runner.py \
          --config=pypy/testrunner_cfg.py \
          --config=machine_cfg.py \
          --root=rpython \
          --timeout=4000 \
          --logfile=testrun.log
    - name: Upload test log
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: rlib-testrun-log-${{ matrix.runner }}
        path: testrun.log

  test-translator:
    runs-on: ubuntu-24.04
    container: ghcr.io/pypy/buildworker_x86_64:latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Create machine config
      shell: bash
      run: echo "parallel_runs=4" > machine_cfg.py
    - name: Test Translator
      env:
        PYPYCHERRYPICK: translator
        PYTHONPATH: .
      shell: bash
      run: |
        pypy testrunner/runner.py \
          --config=pypy/testrunner_cfg.py \
          --config=machine_cfg.py \
          --root=rpython \
          --timeout=4000 \
          --logfile=testrun.log
    - name: Upload test log
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: translator-testrun-log
        path: testrun.log

  test-jit-x86:
    runs-on: ubuntu-24.04
    container: ghcr.io/pypy/buildworker_x86_64:latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Create machine config
      shell: bash
      run: echo "parallel_runs=4" > machine_cfg.py
    - name: Test JIT - X86
      env:
        PYPYCHERRYPICK: jit/backend/x86
        PYTHONPATH: .
      shell: bash
      run: |
        pypy testrunner/runner.py \
          --config=pypy/testrunner_cfg.py \
          --config=machine_cfg.py \
          --root=rpython \
          --timeout=4000 \
          --logfile=testrun.log
    - name: Upload test log
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: jit-x86-testrun-log
        path: testrun.log

  test-jit-other:
    runs-on: ubuntu-24.04
    container: ghcr.io/pypy/buildworker_x86_64:latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Create machine config
      shell: bash
      run: echo "parallel_runs=4" > machine_cfg.py
    - name: Test JIT - Other
      env:
        PYPYCHERRYPICK: jit/metainterp:jit/codewriter:jit/tl:jit/tool:jit/backend/aarch64:jit/backend/arm:jit/backend/llgraph:jit/backend/llsupport:jit/backend/ppc:jit/backend/riscv:jit/backend/test:jit/backend/tool:jit/backend/zarch
        PYTHONPATH: .
      shell: bash
      run: |
        pypy testrunner/runner.py \
          --config=pypy/testrunner_cfg.py \
          --config=machine_cfg.py \
          --root=rpython \
          --timeout=4000 \
          --logfile=testrun.log
    - name: Upload test log
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: jit-other-testrun-log
        path: testrun.log
