      shell: bash
      run: |
        if [ -n "$DOCKER_IMAGE" ]; then
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e PYPYCHERRYPICK \
            -e PYTHONPATH \
            "$DOCKER_IMAGE" \
            pypy testrunner/runner.py \
