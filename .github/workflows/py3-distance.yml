name: Python 3 distance

# Reports how far rpython/ is from being importable on Python 3, and on pull
# requests fails if any category grew.  This is a ratchet, not a test suite:
# it costs seconds, needs no PyPy, and exists so that the clean-ups that get
# the tree there are not silently undone afterwards.
#
# Everything it counts has a spelling that means the same thing on Python 2
# and Python 3, so a failure here is always fixable without forking the
# source and without a Python 3 host to check against.

on:
  pull_request:
    branches: [ "main", "py3.[0-9]+" ]
    paths:
      - "rpython/**/*"
      - ".github/workflows/py3-distance.yml"
  push:
    branches: [ "main", "py3.[0-9]+" ]
    paths:
      - "rpython/**/*"
  workflow_dispatch:

concurrency:
  group: py3-distance-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  distance:
    name: distance to Python 3
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --check builds a worktree at the base commit, so the history has
          # to be there
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Report
        run: python rpython/tool/py3distance.py

      - name: Ratchet against the base commit
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python rpython/tool/py3distance.py \
            --check ${{ github.event.pull_request.base.sha }}
