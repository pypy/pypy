[pytest]
addopts = -rf
filterwarnings =
    ignore:BaseException.message:DeprecationWarning
    # the pinned pytest<=6.2.5 assertion rewriter still uses the deprecated
    # ast.Str/ast.Num/ast.NameConstant aliases
    ignore:ast\.\w+ is deprecated:DeprecationWarning
    ignore:Attribute \w+ is deprecated:DeprecationWarning
